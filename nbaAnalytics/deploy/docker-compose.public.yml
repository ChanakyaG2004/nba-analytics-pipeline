services:
  dashboard:
    build:
      context: ../hf_space
    restart: unless-stopped
    ports:
      - "80:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
